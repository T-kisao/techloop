name: TechLoop Daily Build

on:
  schedule:
    # Runs every day at 07:00 IST (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news aggregator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate.py

      - name: Commit and push updated index.html
        run: |
          git config user.name  "TechLoop Bot"
          git config user.email "bot@techloop.ie"
          git add index.html
          git commit -m "Daily build: $(date +'%Y-%m-%d %H:%M UTC')" --allow-empty
          git push
